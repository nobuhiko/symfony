# EC-CUBE 3.0.18 向けに出している 11 個の部品(Symfony 2.7.52)の元のテストを、PHP 7.1 と 7.4 で回す。
# 同じテストを元のバージョン(v2.7.52)のコードでも回し、修正を移したことで新しく落ちたテストだけを失敗にする。
# Runs the original tests of the 11 Symfony 2.7.52 components this package ships, on PHP 7.1 and 7.4, once with
# this fork and once with the upstream v2.7.52 code, and fails only on tests that break because of the backports.
name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phpunit:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        php: ['7.1', '7.4']
    env:
      BASE: 4d0899c5e3b30b3be591f8349ce92529d79bee93 # v2.7.52
      SYMFONY_PHPUNIT_VERSION: '5.7'
      SYMFONY_DEPRECATIONS_HELPER: weak
      COMPONENTS: Component/Config Component/DomCrawler Component/HttpFoundation Component/HttpKernel Component/Process Component/Routing Component/Serializer Component/Validator Component/Yaml Bridge/Monolog Bridge/Twig
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: mbstring, intl, pdo_sqlite
          coverage: none
      # テストのときだけ、リポジトリの src/ 全体を読めるようにする(テストがほかの部品も使うため)。require-dev もここで入れる
      - name: install test tools
        run: |
          rm -f composer.lock
          composer config audit.block-insecure false 2>/dev/null || true  # Composer 2.2(PHP 7.1)には、この設定も差し止めも無い
          php -r '$j=json_decode(file_get_contents("composer.json"),true); $j["autoload-dev"]=array("psr-0"=>array("Symfony\\"=>"src/")); file_put_contents("composer.json", json_encode($j, JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES));'
          composer require --dev --no-interaction --no-progress "symfony/phpunit-bridge:^3.4" "doctrine/annotations:~1.0" "doctrine/cache:~1.0" "egulias/email-validator:~1.2"
      - name: tests with this fork
        run: |
          for c in $COMPONENTS; do echo "::group::$c"; case $c in Component/Validator|Bridge/Twig) lim=1800; dbg=--debug;; *) lim=600; dbg=;; esac; timeout $lim vendor/bin/simple-phpunit $dbg --bootstrap vendor/autoload.php --exclude-group benchmark,slow,network,tty --log-junit "junit-head-${c//\//-}.xml" src/Symfony/$c/Tests || echo "exit $? for $c"; echo "::endgroup::"; done
      - name: tests with the upstream v2.7.52 code
        run: |
          git checkout "$BASE" -- src
          for c in $COMPONENTS; do echo "::group::$c"; case $c in Component/Validator|Bridge/Twig) lim=1800; dbg=--debug;; *) lim=600; dbg=;; esac; timeout $lim vendor/bin/simple-phpunit $dbg --bootstrap vendor/autoload.php --exclude-group benchmark,slow,network,tty --log-junit "junit-base-${c//\//-}.xml" src/Symfony/$c/Tests || echo "exit $? for $c"; echo "::endgroup::"; done
          git checkout HEAD -- src
      - name: compare
        run: php .github/ci/compare.php "junit-head*.xml" "junit-base*.xml"
